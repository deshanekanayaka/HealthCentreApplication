# ============================================================
# Server
# ============================================================
# PORT is set automatically by Railway; defaults to 8080 locally
server.port=${PORT:8080}

# ============================================================
# DataSource — PostgreSQL
# ============================================================
# Set DATABASE_URL, DB_USERNAME, DB_PASSWORD as environment
# variables in Railway (or your local .env).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/healthcentre}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
# 'update' creates/alters tables on startup to match entities.
# Use 'validate' in a mature production app (with Flyway migrations).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# OpenAPI / Swagger
# ============================================================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method

# ============================================================
# Application config
# ============================================================
app.staff.limit=50

# Comma-separated list of origins allowed to call the API.
# During development: http://localhost:5173 (Vite dev server).
# In production: set CORS_ALLOWED_ORIGINS to your Vercel URL.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
